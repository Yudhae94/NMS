<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Network operations background">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071233"/><stop offset="0.5" stop-color="#0a1a3d"/><stop offset="1" stop-color="#04091c"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0.22" cy="0.18" r="0.55">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.38"/><stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0.86" cy="0.86" r="0.5">
      <stop offset="0" stop-color="#6366f1" stop-opacity="0.32"/><stop offset="1" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="64" height="64" patternUnits="userSpaceOnUse">
      <path d="M64 0H0V64" fill="none" stroke="#38bdf8" stroke-opacity="0.09" stroke-width="1"/>
    </pattern>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#grid)"/>
  <rect width="1600" height="900" fill="url(#glowA)"/>
  <rect width="1600" height="900" fill="url(#glowB)"/>

  <!-- "rack" server: deretan panel dengan LED -->
  <g opacity="0.55">
    <g transform="translate(90,150)">
      <g fill="#0e1c40" stroke="#1e3a6d" stroke-width="2">
        <rect x="0" y="0" width="210" height="74" rx="8"/><rect x="0" y="86" width="210" height="74" rx="8"/>
        <rect x="0" y="172" width="210" height="74" rx="8"/><rect x="0" y="258" width="210" height="74" rx="8"/>
        <rect x="0" y="344" width="210" height="74" rx="8"/><rect x="0" y="430" width="210" height="74" rx="8"/>
      </g>
      <g fill="#22d3ee" opacity="0.85">
        <rect x="14" y="30" width="34" height="6" rx="3"/><rect x="14" y="116" width="34" height="6" rx="3"/>
        <rect x="14" y="202" width="34" height="6" rx="3"/><rect x="14" y="288" width="34" height="6" rx="3"/>
        <rect x="14" y="374" width="34" height="6" rx="3"/><rect x="14" y="460" width="34" height="6" rx="3"/>
      </g>
      <g fill="#818cf8" opacity="0.7">
        <rect x="60" y="26" width="86" height="14" rx="7"/><rect x="60" y="112" width="86" height="14" rx="7"/>
        <rect x="60" y="198" width="86" height="14" rx="7"/><rect x="60" y="284" width="86" height="14" rx="7"/>
        <rect x="60" y="370" width="86" height="14" rx="7"/><rect x="60" y="456" width="86" height="14" rx="7"/>
      </g>
      <g fill="#4ade80" opacity="0.75">
        <circle cx="182" cy="33" r="5"/><circle cx="182" cy="119" r="5"/><circle cx="182" cy="205" r="5"/>
        <circle cx="182" cy="291" r="5"/><circle cx="182" cy="377" r="5"/><circle cx="182" cy="463" r="5"/>
      </g>
    </g>
    <g transform="translate(1300,120) scale(-1,1)">
      <g fill="#0e1c40" stroke="#1e3a6d" stroke-width="2">
        <rect x="0" y="0" width="190" height="70" rx="8"/><rect x="0" y="82" width="190" height="70" rx="8"/>
        <rect x="0" y="164" width="190" height="70" rx="8"/><rect x="0" y="246" width="190" height="70" rx="8"/>
        <rect x="0" y="328" width="190" height="70" rx="8"/><rect x="0" y="410" width="190" height="70" rx="8"/>
      </g>
      <g fill="#38bdf8" opacity="0.8">
        <rect x="14" y="28" width="30" height="6" rx="3"/><rect x="14" y="110" width="30" height="6" rx="3"/>
        <rect x="14" y="192" width="30" height="6" rx="3"/><rect x="14" y="274" width="30" height="6" rx="3"/>
        <rect x="14" y="356" width="30" height="6" rx="3"/><rect x="14" y="438" width="30" height="6" rx="3"/>
      </g>
      <g fill="#f59e0b" opacity="0.7">
        <circle cx="166" cy="31" r="4.5"/><circle cx="166" cy="113" r="4.5"/><circle cx="166" cy="195" r="4.5"/>
        <circle cx="166" cy="277" r="4.5"/><circle cx="166" cy="359" r="4.5"/><circle cx="166" cy="441" r="4.5"/>
      </g>
    </g>
  </g>

  <!-- jalur + node network flow -->
  <g fill="none" stroke="#38bdf8" stroke-opacity="0.35" stroke-width="1.5">
    <path d="M340 260 L700 300 L980 220 L1250 330"/>
    <path d="M700 300 L720 560 L1020 660 L1300 560"/>
    <path d="M340 520 L720 560"/>
    <path d="M980 220 L1020 660"/>
    <path d="M1250 330 L1300 560"/>
  </g>
  <g>
    <circle cx="340" cy="260" r="7" fill="#0b1226" stroke="#38bdf8" stroke-width="3"/>
    <circle cx="700" cy="300" r="9" fill="#0b1226" stroke="#22d3ee" stroke-width="3"/>
    <circle cx="980" cy="220" r="7" fill="#0b1226" stroke="#818cf8" stroke-width="3"/>
    <circle cx="1250" cy="330" r="7" fill="#0b1226" stroke="#38bdf8" stroke-width="3"/>
    <circle cx="340" cy="520" r="6" fill="#0b1226" stroke="#4ade80" stroke-width="3"/>
    <circle cx="720" cy="560" r="8" fill="#0b1226" stroke="#22d3ee" stroke-width="3"/>
    <circle cx="1020" cy="660" r="7" fill="#0b1226" stroke="#818cf8" stroke-width="3"/>
    <circle cx="1300" cy="560" r="6" fill="#0b1226" stroke="#f59e0b" stroke-width="3"/>
  </g>
  <g filter="url(#soft)" opacity="0.75">
    <circle cx="700" cy="300" r="16" fill="#22d3ee"/><circle cx="720" cy="560" r="14" fill="#38bdf8"/>
    <circle cx="1020" cy="660" r="13" fill="#818cf8"/>
  </g>
  <g fill="#e8eefc" opacity="0.9">
    <circle cx="700" cy="300" r="3"/><circle cx="720" cy="560" r="3"/><circle cx="1020" cy="660" r="3"/>
  </g>

  <!-- vignette -->
  <rect width="1600" height="900" fill="none"/>
</svg>